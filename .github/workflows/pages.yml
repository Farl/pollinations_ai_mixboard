name: Deploy Static Site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate runtime config
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          POLLINATIONS_API_BASE_URL: ${{ vars.POLLINATIONS_API_BASE_URL }}
          POLLINATIONS_IMAGE_MODEL: ${{ vars.POLLINATIONS_IMAGE_MODEL }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > config.runtime.js <<EOF
          window.MIXBOARD_CONFIG = {
            AI_PROVIDER: "${AI_PROVIDER:-pollinations}",
            POLLINATIONS_API_BASE_URL: "${POLLINATIONS_API_BASE_URL:-https://gen.pollinations.ai}",
            POLLINATIONS_IMAGE_MODEL: "${POLLINATIONS_IMAGE_MODEL:-kontext}",
            POLLINATIONS_API_KEY: "${POLLINATIONS_API_KEY}",
            GH_MODELS_TOKEN: "${GH_MODELS_TOKEN}",
            GITHUB_TOKEN: "${GITHUB_TOKEN}"
          };
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
